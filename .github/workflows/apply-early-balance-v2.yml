name: Apply one-time early balance v2

on:
  push:
    branches:
      - agent/classic-simulator-lobby

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time early balance v2 workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/classic-simulator-lobby
          fetch-depth: 0

      - name: Apply exact balance replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/ServerScriptService/GameServer.server.lua')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'local BASIC_CHEST_COST = 150': 'local BASIC_CHEST_COST = 250',
              'Title = "Roll 120 Times"': 'Title = "Roll 180 Times"',
              'Description = "Roll 120 times."': 'Description = "Roll 180 times."',
              'Title = "Discover 120 Concepts"': 'Title = "Discover 180 Concepts"',
              'Description = "Discover 120 new Concepts."': 'Description = "Discover 180 new Concepts."',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          goal_count = text.count('\t\tGoal = 120,')
          if goal_count != 2:
              raise SystemExit(f'Expected exactly two Goal = 120 entries, found {goal_count}')
          text = text.replace('\t\tGoal = 120,', '\t\tGoal = 180,', 2)

          path.write_text(text, encoding='utf-8')

      - name: Commit balance update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerScriptService/GameServer.server.lua
          git diff --cached --check
          git commit -m "Retune first chest and quest timing [skip ci]"
          git push origin HEAD:agent/classic-simulator-lobby
