name: Apply one-time early balance patch

on:
  push:
    branches:
      - agent/classic-simulator-lobby

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time early balance patch workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/classic-simulator-lobby
          fetch-depth: 0

      - name: Apply exact balance replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ServerScriptService/GameServer.server.lua")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "local BASIC_CHEST_COST = 25": "local BASIC_CHEST_COST = 150",
              'Title = "Roll 50 Times",': 'Title = "Roll 120 Times",',
              'Description = "Roll 50 times.",': 'Description = "Roll 120 times.",',
              "\t\tGoal = 50,": "\t\tGoal = 120,",
              'Title = "Discover 3 Concepts",': 'Title = "Discover 120 Concepts",',
              'Description = "Discover 3 new Concepts.",': 'Description = "Discover 120 new Concepts.",',
              "\t\tGoal = 3,": "\t\tGoal = 120,",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify changed values
        shell: bash
        run: |
          grep -F 'local BASIC_CHEST_COST = 150' src/ServerScriptService/GameServer.server.lua
          grep -F 'Title = "Roll 120 Times",' src/ServerScriptService/GameServer.server.lua
          grep -F 'Description = "Roll 120 times.",' src/ServerScriptService/GameServer.server.lua
          grep -F 'Title = "Discover 120 Concepts",' src/ServerScriptService/GameServer.server.lua
          grep -F 'Description = "Discover 120 new Concepts.",' src/ServerScriptService/GameServer.server.lua
          test "$(grep -F $'\t\tGoal = 120,' src/ServerScriptService/GameServer.server.lua | wc -l)" -eq 2
          git diff --check

      - name: Commit balance patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerScriptService/GameServer.server.lua
          git commit -m "Tune early chest and quest pacing [skip ci]"
          git push origin HEAD:agent/classic-simulator-lobby
