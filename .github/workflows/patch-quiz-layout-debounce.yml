name: Patch quiz layout and difficulty debounce once

on:
  push:
    branches:
      - agent/classic-simulator-lobby

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger one-time quiz layout debounce patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classic-simulator-lobby
          fetch-depth: 0

      - name: Patch quiz layout and debounce
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/ServerScriptService/BrainQuizArena.server.lua')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'local installedMap = nil\nlocal answerQuestion\n',
                  'local installedMap = nil\nlocal difficultyTouchAt = {}\nlocal answerQuestion\n',
              ),
              (
                  'local center = Vector3.new(48 * scale, 0, -38 * scale)',
                  'local center = Vector3.new(48 * scale, 0, -34 * scale)',
              ),
              (
                  '''local function selectDifficulty(player, difficultyName)\n\tlocal config = DIFFICULTIES[difficultyName]\n\tif not config then\n\t\treturn\n\tend\n''',
                  '''local function selectDifficulty(player, difficultyName)\n\tlocal config = DIFFICULTIES[difficultyName]\n\tif not config then\n\t\treturn\n\tend\n\n\tlocal now = os.clock()\n\tlocal lastTouch = tonumber(difficultyTouchAt[player.UserId]) or 0\n\tif now - lastTouch < 1.25 then\n\t\treturn\n\tend\n\tdifficultyTouchAt[player.UserId] = now\n''',
              ),
              (
                  '''Players.PlayerRemoving:Connect(function(player)\n\tstates[player.UserId] = nil\n\tsaveStates[player.UserId] = nil\nend)\n''',
                  '''Players.PlayerRemoving:Connect(function(player)\n\tstates[player.UserId] = nil\n\tsaveStates[player.UserId] = nil\n\tdifficultyTouchAt[player.UserId] = nil\nend)\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerScriptService/BrainQuizArena.server.lua
          git diff --cached --check
          git commit -m "Fix quiz layout spacing and difficulty touch debounce [skip ci]"
          git push origin HEAD:agent/classic-simulator-lobby
