name: Fix knowledge sprint signs once

on:
  push:
    branches:
      - agent/classic-simulator-lobby

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time knowledge sprint sign fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classic-simulator-lobby
          fetch-depth: 0

      - name: Patch fixed signs
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/ServerScriptService/KnowledgeSprint.server.lua')
          text = path.read_text(encoding='utf-8')

          old_post = '''\tpost.CanQuery = false\n\n\tlocal board = createPart('''
          new_post = '''\tpost.CanCollide = false\n\tpost.CanQuery = false\n\n\tlocal board = createPart('''
          if text.count(old_post) != 1:
              raise SystemExit('post block mismatch')
          text = text.replace(old_post, new_post, 1)

          old_board = '''\tboard.CanQuery = false\n\n\tlocal trim = createPart(\n\t\tparent,\n\t\tname .. "_Trim",\n\t\tVector3.new(21, 8, 0.35),\n\t\tposition + Vector3.new(0, 10, 0.72),\n\t\taccentColor,\n\t\tEnum.Material.Neon,\n\t\tfalse\n\t)\n\ttrim.CanCollide = false\n\ttrim.CanQuery = false\n\n\taddSurfaceText(board, text)'''
          new_board = '''\tboard.CanCollide = false\n\tboard.CanQuery = false\n\n\tlocal header = createPart(\n\t\tparent,\n\t\tname .. "_Header",\n\t\tVector3.new(20, 0.8, 1.3),\n\t\tposition + Vector3.new(0, 13.3, 0),\n\t\taccentColor,\n\t\tEnum.Material.Neon,\n\t\tfalse\n\t)\n\theader.CanCollide = false\n\theader.CanQuery = false\n\n\taddSurfaceText(board, text)'''
          if text.count(old_board) != 1:
              raise SystemExit('board block mismatch')
          text = text.replace(old_board, new_board, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit sign fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerScriptService/KnowledgeSprint.server.lua
          git diff --cached --check
          git commit -m "Fix knowledge sprint sign visibility [skip ci]"
          git push origin HEAD:agent/classic-simulator-lobby
